# Serveur web du conteneur « site » (site vitrine), derrière le nginx du logiciel.
# 13/11/2026 (audit du site de Mathilde, site-042 et 045) :
# - une adresse inconnue répond 404 (avec la page « Page introuvable » du site) au lieu de 200 ;
# - les pages connues répondent 200 ; leur liste suit frontend/src/App.js
#   (l'essai backend/tests/test_site_retours_13_11.py compare les listes) ;
# - les cartes de code (.map) ne sont jamais servies.
# 15/11/2026 (choix de Théo du 13/11/2026, « pré-rendu Google ») : chaque page publique a son HTML
# complet, écrit à la construction de l'image (frontend/scripts/prerender.js, dossier prerendu/),
# avec sa propre canonique ; il est servi d'abord, puis React reprend la page. À défaut de page
# pré-rendue (/devis, /dashboard, adresse écrite en majuscules), le gabarit de l'application
# (index.html), comme avant. Les pages HTML sont revalidées à chaque visite (no-cache) pour qu'une
# mise en ligne se voie tout de suite.
# Les en-têtes de sécurité et la version masquée sont posés par le nginx du logiciel.
server {
    listen 80;
    server_name _;
    server_tokens off;
    root /usr/share/nginx/html;
    index index.html;

    # Accueil : page pré-rendue, sinon l'application.
    location = / {
        add_header Cache-Control "no-cache";
        try_files /prerendu/index.html /index.html =404;
    }

    # Pages connues du site : page pré-rendue (prerendu/<page>.html), sinon l'application (index.html),
    # code 200. Sans distinction de majuscules, comme le routeur de l'application.
    location ~* ^/(devis|dashboard|contact|recrutement|mentions-legales|politique-de-confidentialite|agent-securite-prevention|securite-cynophile-maitre-chien|detection-explosifs-cynodex|ssiap-securite-incendie|securite-evenementielle|surveillance-chantier-site|securite-sites-industriels-commerciaux|securite-residentielle|securite-erp-etablissements-public|protection-rapprochee|grand-deplacement-securite-france|securite-privee-sud-france|securite-privee-toulon|securite-privee-toulouse|securite-privee-nice-monaco|securite-privee-bordeaux|securite-privee-montpellier|securite-privee-nimes|securite-privee-perpignan|securite-privee-marseille|securite-privee-avignon|securite-privee-lyon|securite-privee-grenoble|securite-privee-annecy)/?$ {
        add_header Cache-Control "no-cache";
        try_files /prerendu/$1.html /index.html =404;
    }

    # Les fichiers pré-rendus ne se servent qu'à l'adresse de leur page : jamais sous /prerendu/
    # (pas de doublon public d'une page).
    location ^~ /prerendu/ {
        internal;
    }

    # Cartes de code source : jamais publiques.
    location ~ \.map$ {
        return 404;
    }

    location ~* \.(js|css|png|jpg|jpeg|gif|svg|ico|webp|woff|woff2|ttf|eot)$ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    # Fichiers du site (robots.txt, sitemap.xml, images…) ; tout le reste répond 404.
    location / {
        try_files $uri =404;
    }

    # La page 404 est celle du site (index.html affiche « Page introuvable »), avec le code 404.
    error_page 404 /index.html;
}
