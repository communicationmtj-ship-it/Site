# Serveur web du conteneur « site » (site vitrine), derrière le nginx du logiciel.
# 13/11/2026 (audit du site de Mathilde, site-042 et 045) :
# - une adresse inconnue répond 404 (avec la page « Page introuvable » du site) au lieu de 200 ;
# - les pages connues répondent 200 ; leur liste suit frontend/src/App.js
#   (l'essai backend/tests/test_site_retours_13_11.py compare les deux listes) ;
# - les cartes de code (.map) ne sont jamais servies.
# Les en-têtes de sécurité et la version masquée sont posés par le nginx du logiciel.
server {
    listen 80;
    server_name _;
    server_tokens off;
    root /usr/share/nginx/html;
    index index.html;

    # Accueil
    location = / {
        try_files /index.html =404;
    }

    # Pages connues du site : servies par l'application (index.html), code 200.
    # Sans distinction de majuscules, comme le routeur de l'application.
    location ~* ^/(devis|dashboard|contact|recrutement|mentions-legales|politique-de-confidentialite|agent-securite-prevention|securite-cynophile-maitre-chien|detection-explosifs-cynodex|ssiap-securite-incendie|securite-evenementielle|surveillance-chantier-site|securite-sites-industriels-commerciaux|securite-residentielle|securite-erp-etablissements-public|protection-rapprochee|grand-deplacement-securite-france|securite-privee-toulon|securite-privee-toulouse|securite-privee-nice-monaco|securite-privee-sud-france|securite-privee-bordeaux)/?$ {
        try_files /index.html =404;
    }

    # Cartes de code source : jamais publiques.
    location ~ \.map$ {
        return 404;
    }

    location ~* \.(js|css|png|jpg|jpeg|gif|svg|ico|webp|woff|woff2|ttf|eot)$ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    # Fichiers du site (robots.txt, sitemap.xml, images…) ; tout le reste répond 404.
    location / {
        try_files $uri =404;
    }

    # La page 404 est celle du site (index.html affiche « Page introuvable »), avec le code 404.
    error_page 404 /index.html;
}
